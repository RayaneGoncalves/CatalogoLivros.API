<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catálogo de Livros</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f9f0f5;
      color: #5a5a5a;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      color: #c084a0;
      font-size: 2rem;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    h2 {
      color: #a0a8d0;
      font-size: 1.3rem;
      margin-bottom: 16px;
      border-left: 4px solid #c9b8e8;
      padding-left: 10px;
    }

    .section {
      background: #fff7fb;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 40px;
      box-shadow: 0 2px 12px rgba(200, 160, 210, 0.15);
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    input, select {
      padding: 8px 14px;
      border: 1.5px solid #e0c8e8;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #5a5a5a;
      background: #fdf4ff;
      outline: none;
      width: 210px;
    }

    input:focus, select:focus {
      border-color: #c084a0;
    }

    button {
      padding: 8px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    .btn-add {
      background-color: #c9b8e8;
      color: #fff;
    }

    .btn-delete {
      background-color: #f7c5d0;
      color: #a05060;
      padding: 4px 12px;
      font-size: 0.82rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      background-color: #ead5f0;
      color: #7a5a8a;
      padding: 10px 14px;
      text-align: left;
      font-size: 0.9rem;
    }

    td {
      padding: 9px 14px;
      border-bottom: 1px solid #f0e0f5;
      font-size: 0.9rem;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: #fdf0ff; }
  </style>
</head>
<body>

  <h1>📚 Catálogo de Livros</h1>

  <div class="section">
    <h2>Autores</h2>
    <div class="form-row">
      <input id="autorNome" placeholder="Nome do autor" />
      <input id="autorNacionalidade" placeholder="Nacionalidade" />
      <button class="btn-add" onclick="criarAutor()">+ Adicionar</button>
    </div>
    <table>
      <thead><tr><th>Nome</th><th>Nacionalidade</th><th>Ações</th></tr></thead>
      <tbody id="tabelaAutores"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Livros</h2>
    <div class="form-row">
      <input id="livroTitulo" placeholder="Título do livro" />
      <input id="livroAno" placeholder="Ano de publicação" type="number" />
      <select id="livroAutorId"><option value="">Selecione o autor</option></select>
      <button class="btn-add" onclick="criarLivro()">+ Adicionar</button>
    </div>
    <table>
      <thead><tr><th>Título</th><th>Ano</th><th>Autor</th><th>Ações</th></tr></thead>
      <tbody id="tabelaLivros"></tbody>
    </table>
  </div>

  <script>
    const api = '';

    async function carregarAutores() {
      const res = await fetch(`${api}/autores`);
      const autores = await res.json();
      const tbody = document.getElementById('tabelaAutores');
      const select = document.getElementById('livroAutorId');
      tbody.innerHTML = '';
      select.innerHTML = '<option value="">Selecione o autor</option>';
      autores.forEach(a => {
        tbody.innerHTML += `<tr>
          <td>${a.nome}</td>
          <td>${a.nacionalidade}</td>
          <td><button class="btn-delete" onclick="deletarAutor('${a.id}')">Excluir</button></td>
        </tr>`;
        select.innerHTML += `<option value="${a.id}">${a.nome}</option>`;
      });
    }

    async function criarAutor() {
      const nome = document.getElementById('autorNome').value;
      const nacionalidade = document.getElementById('autorNacionalidade').value;
      await fetch(`${api}/autores`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, nacionalidade })
      });
      document.getElementById('autorNome').value = '';
      document.getElementById('autorNacionalidade').value = '';
      carregarAutores();
    }

    async function deletarAutor(id) {
      await fetch(`${api}/autores/${id}`, { method: 'DELETE' });
      carregarAutores();
    }

    async function carregarLivros() {
      const resL = await fetch(`${api}/livros`);
      const livros = await resL.json();
      const resA = await fetch(`${api}/autores`);
      const autores = await resA.json();
      const tbody = document.getElementById('tabelaLivros');
      tbody.innerHTML = '';
      livros.forEach(l => {
        const autor = autores.find(a => a.id === l.autorId);
        tbody.innerHTML += `<tr>
          <td>${l.titulo}</td>
          <td>${l.anoPublicacao}</td>
          <td>${autor ? autor.nome : 'Desconhecido'}</td>
          <td><button class="btn-delete" onclick="deletarLivro('${l.id}')">Excluir</button></td>
        </tr>`;
      });
    }

    async function criarLivro() {
      const titulo = document.getElementById('livroTitulo').value;
      const anoPublicacao = parseInt(document.getElementById('livroAno').value);
      const autorId = document.getElementById('livroAutorId').value;
      await fetch(`${api}/livros`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titulo, anoPublicacao, autorId })
      });
      document.getElementById('livroTitulo').value = '';
      document.getElementById('livroAno').value = '';
      carregarLivros();
    }

    async function deletarLivro(id) {
      await fetch(`${api}/livros/${id}`, { method: 'DELETE' });
      carregarLivros();
    }

    carregarAutores();
    carregarLivros();
  </script>
</body>
</html>
