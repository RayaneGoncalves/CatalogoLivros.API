<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catálogo de Livros</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #333; }
    h2 { color: #555; margin-top: 40px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
    th { background: #f0f0f0; }
    button { margin: 4px; padding: 6px 12px; cursor: pointer; }
    input, select { padding: 6px; margin: 4px; width: 200px; }
    .form-group { margin: 8px 0; }
  </style>
</head>
<body>
  <h1>📚 Catálogo de Livros</h1>

  <h2>Autores</h2>
  <div>
    <div class="form-group"><input id="autorNome" placeholder="Nome do autor" /></div>
    <div class="form-group"><input id="autorNacionalidade" placeholder="Nacionalidade" /></div>
    <button onclick="criarAutor()">Adicionar Autor</button>
  </div>
  <table>
    <thead><tr><th>Nome</th><th>Nacionalidade</th><th>Ações</th></tr></thead>
    <tbody id="tabelaAutores"></tbody>
  </table>

  <h2>Livros</h2>
  <div>
    <div class="form-group"><input id="livroTitulo" placeholder="Título do livro" /></div>
    <div class="form-group"><input id="livroAno" placeholder="Ano de publicação" type="number" /></div>
    <div class="form-group">
      <select id="livroAutorId"><option value="">Selecione o autor</option></select>
    </div>
    <button onclick="criarLivro()">Adicionar Livro</button>
  </div>
  <table>
    <thead><tr><th>Título</th><th>Ano</th><th>Autor</th><th>Ações</th></tr></thead>
    <tbody id="tabelaLivros"></tbody>
  </table>

  <script>
    const api = '';

    async function carregarAutores() {
      const res = await fetch(`${api}/autores`);
      const autores = await res.json();
      const tbody = document.getElementById('tabelaAutores');
      const select = document.getElementById('livroAutorId');
      tbody.innerHTML = '';
      select.innerHTML = '<option value="">Selecione o autor</option>';
      autores.forEach(a => {
        tbody.innerHTML += `<tr>
          <td>${a.nome}</td>
          <td>${a.nacionalidade}</td>
          <td><button onclick="deletarAutor('${a.id}')">Excluir</button></td>
        </tr>`;
        select.innerHTML += `<option value="${a.id}">${a.nome}</option>`;
      });
    }

    async function criarAutor() {
      const nome = document.getElementById('autorNome').value;
      const nacionalidade = document.getElementById('autorNacionalidade').value;
      await fetch(`${api}/autores`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, nacionalidade })
      });
      document.getElementById('autorNome').value = '';
      document.getElementById('autorNacionalidade').value = '';
      carregarAutores();
    }

    async function deletarAutor(id) {
      await fetch(`${api}/autores/${id}`, { method: 'DELETE' });
      carregarAutores();
    }

    async function carregarLivros() {
      const resL = await fetch(`${api}/livros`);
      const livros = await resL.json();
      const resA = await fetch(`${api}/autores`);
      const autores = await resA.json();
      const tbody = document.getElementById('tabelaLivros');
      tbody.innerHTML = '';
      livros.forEach(l => {
        const autor = autores.find(a => a.id === l.autorId);
        tbody.innerHTML += `<tr>
          <td>${l.titulo}</td>
          <td>${l.anoPublicacao}</td>
          <td>${autor ? autor.nome : 'Desconhecido'}</td>
          <td><button onclick="deletarLivro('${l.id}')">Excluir</button></td>
        </tr>`;
      });
    }

    async function criarLivro() {
      const titulo = document.getElementById('livroTitulo').value;
      const anoPublicacao = parseInt(document.getElementById('livroAno').value);
      const autorId = document.getElementById('livroAutorId').value;
      await fetch(`${api}/livros`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titulo, anoPublicacao, autorId })
      });
      document.getElementById('livroTitulo').value = '';
      document.getElementById('livroAno').value = '';
      carregarLivros();
    }

    async function deletarLivro(id) {
      await fetch(`${api}/livros/${id}`, { method: 'DELETE' });
      carregarLivros();
    }

    carregarAutores();
    carregarLivros();
  </script>
</body>
</html>
